[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trailytics"
version = "0.3.0"
description = "Trailytics Python SDK & CLI - AI Observability & Tracing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Trailytics Team" }
]
keywords = ["observability", "tracing", "llm", "ai", "trailytics", "opik", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "opik==2.2.138",
    "click>=8.0.0",
    "rich>=10.0.0",
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.scripts]
trailytics = "trailytics.cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"trailytics.deployment" = [
    "*.yaml",
    "*.conf",
    "clickhouse_config/*.xml",
    "clickhouse_config/users.d/*.xml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
